version: "3.8"

services:
  jupyter:
    image: lalvarezl/jupyterlab:laal
    container_name: cnt_jupyterlab
    ports:
      - "8888:8888"
    volumes:
      - ../mis-archivos/proyectos:/home/jovyan/work
      #- ./notebooks:/app
    networks:
      - ml_net

  postgres:
    image: lalvarezl/postgresql:laal
    container_name: cnt_postgresql
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow123
      POSTGRES_DB: mlflow_db
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - ml_net

  mlflow:
    image: lalvarezl/mlflow:laal
    container_name: cnt_mlflow
    depends_on:
      - postgres
    ports:
      - "5000:5000"
    environment:
      - MLFLOW_TRACKING_URI=postgresql://mlflow:mlflow123@postgres:5432/mlflow_db
    volumes:
      #- ./mlruns:/app/mlruns
      - ../mis-archivos/mlruns:/home/jovyan/work
    command: >
      mlflow ui
      --backend-store-uri postgresql://mlflow:mlflow123@postgres:5432/mlflow_db
      --host 0.0.0.0
      --port 5000
    networks:
      - ml_net

volumes:
  pg_data:

networks:
  ml_net:
  