version: "3.8"

services:
  jupyter:
    image: luisalvarez/jupyterlab-custom:latest
    container_name: jupyter_lab
    ports:
      - "8888:8888"
    volumes:
      - ./notebooks:/home/jovyan/work
    networks:
      - ml_net

  postgres:
    image: postgres:14
    container_name: mlflow_postgres
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow123
      POSTGRES_DB: mlflow_db
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - ml_net

  mlflow:
    image: luisalvarez/mlflow-custom:latest
    container_name: mlflow_app
    depends_on:
      - postgres
    ports:
      - "5000:5000"
    environment:
      - MLFLOW_TRACKING_URI=postgresql://mlflow:mlflow123@postgres:5432/mlflow_db
    command: >
      mlflow ui
      --backend-store-uri postgresql://mlflow:mlflow123@postgres:5432/mlflow_db
      --host 0.0.0.0
      --port 5000
    networks:
      - ml_net

volumes:
  pg_data:

networks:
  ml_net:
  