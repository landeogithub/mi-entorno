[supervisord]
nodaemon=true

[program:jupyter]
command=jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root --NotebookApp.token='1234'
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr

[program:mlflow]
command=mlflow ui --host=0.0.0.0 --port=5000 --backend-store-uri sqlite:///mlflow.db
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
